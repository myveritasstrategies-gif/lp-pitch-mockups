name: Decode mockup PNGs
on:
  push:
    paths:
      - ".github/workflows/decode-pngs.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public mockup PNGs
        run: |
          set -euo pipefail
          BIN=5f895a5e9b743600
          for f in 01-create-flow-wizard.png 02-published-landing.png 03-current-vs-upgraded.png 04-execute-generate.png; do
            echo "Downloading $f"
            curl -fsSL --retry 5 --retry-delay 2 -o "$f" "https://filebin.net/${BIN}/$f"
            file "$f"
            python3 -c "import pathlib; p=pathlib.Path('$f'); d=p.read_bytes(); assert d[:8]==bytes.fromhex('89504e470d0a1a0a'), d[:16]; print(p.name, 'png ok', len(d))"
          done
          git config user.email "team@veritasstrategies.io"
          git config user.name "Veritas"
          git add 01-create-flow-wizard.png 02-published-landing.png 03-current-vs-upgraded.png 04-execute-generate.png
          git commit -m "Add landing-page pitch mockup PNGs"
          git push
